name: SENTINEL CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Automated Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Checking
        run: npm run lint

      - name: Execute Automated Test Suite
        run: npm test

      - name: Production Bundle Verification
        run: npm run build

      - name: Validate Dockerfile Build
        run: docker build -t sentinel:ci-test .
